{% extends "auth_base.html" %}

{% block title %}Register - CyberGuard{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">
            <img
                src="{{ url_for('static', filename='images/cyberguard-logo.jpeg') }}"
                alt="CyberGuard Logo"
                class="auth-brand-logo"
            >

            <h1>CyberGuard</h1>
            <p>Learn • Practice • Stay Safe</p>
        </div>

        <div class="auth-heading">
            <h2>Create Account</h2>
            <p>Create your account to start learning cybersecurity.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">

            <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-wrapper">
                    <i class="bi bi-person"></i>
                    <input
                        type="text"
                        id="name"
                        name="username"
                        placeholder="Enter your full name"
                        autocomplete="username"
                        minlength="3"
                        maxlength="50"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="bi bi-envelope"></i>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        maxlength="120"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="bi bi-lock"></i>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-controls="password"
                        aria-pressed="false"
                        onclick="togglePassword('password', this)"
                    >
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="bi bi-lock-fill"></i>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-controls="confirm_password"
                        aria-pressed="false"
                        onclick="togglePassword('confirm_password', this)"
                    >
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <div class="remember-row">
                <label>
                    <input type="checkbox" name="terms" required>
                    I agree to the terms and conditions.
                </label>
            </div>

            <button type="submit" class="auth-button">
                <i class="bi bi-person-plus"></i>
                Create Account
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="{{ url_for('auth.login') }}">Sign In</a>
            </p>
        </div>

    </div>
</div>

<script>
function togglePassword(inputId, button) {
    const passwordInput = document.getElementById(inputId);
    const icon = button.querySelector("i");
    const showPassword = passwordInput.type === "password";

    passwordInput.type = showPassword ? "text" : "password";

    button.setAttribute("aria-pressed", String(showPassword));
    button.setAttribute(
        "aria-label",
        showPassword ? "Hide password" : "Show password"
    );

    icon.classList.toggle("bi-eye", !showPassword);
    icon.classList.toggle("bi-eye-slash", showPassword);
}
</script>

{% endblock %}
